name: validate

on:
  push:
  pull_request:

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install art validation dependencies
        run: python -m pip install -r requirements-art.txt
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild and validate reusable art packs
        run: |
          python tools/build_art_resource_catalog.py
          python tools/build_resource_pack.py --all
          git diff --exit-code -- resource-packs
          python tools/validate_resource_pack.py
          python tools/validate_resource_packs.py
      - name: Validate documentation and templates
        run: python tools/validate_repository.py
